; SnowRunner Head Tracking - configuration
; Edit values, restart the game to apply.
;
; Controls (all remappable, see [Hotkeys]):
;           End  / Ctrl+Shift+Y   toggle tracking
;           PgUp / Ctrl+Shift+G   cycle tracking mode (rotation and position
;                                 / rotation only / position only)
;           PgDn / Ctrl+Shift+H   yaw about world up, or the camera's own

[Network]
UdpPort=4242

[General]
EnableOnStartup=1

[Camera]
; The angle the view spans across the WIDTH of the screen, in degrees, and
; it goes well past what SnowRunner's own Field of View settings reach. 30
; to 140. The cabin and the chase view both render at this angle while it
; is set, whatever the game's own two settings are; 0 turns this off and
; leaves both of them alone.
;
; HeadTracking.log names the angle the game was drawing before this
; applied, which is the number to pick yours relative to. It is a
; rendering setting rather than head tracking, so it stays applied while
; tracking is toggled off, and turning your head ten degrees turns the
; view ten degrees at every setting.
Fov=0

[Hotkeys]
; Windows virtual key codes, in hex. Each action has a nav-cluster key and a
; Ctrl+Shift+<key> chord, and both fire it - remap either or both.
; Common codes: End 0x23, Insert 0x2D, Delete 0x2E, PgUp 0x21,
; PgDn 0x22, F1-F12 0x70-0x7B, A-Z 0x41-0x5A, numpad 0-9 0x60-0x69.
ToggleKey=0x23
CycleModeKey=0x21
YawModeKey=0x22
ChordToggleKey=0x59
ChordCycleModeKey=0x47
ChordYawModeKey=0x48

[Rotation]
YawSensitivity=1.0
PitchSensitivity=1.0
RollSensitivity=1.0
InvertYaw=0
InvertPitch=0
InvertRoll=0
; Smoothing covers rotation and position alike, and the value used is picked
; per connection from where the tracker sends from. 0.0 none .. 1.0 heavy.
LocalSmoothing=0.0
RemoteSmoothing=0.15

[Position]
Enabled=1
SensitivityX=1.0
SensitivityY=1.0
SensitivityZ=1.0
InvertX=0
InvertY=0
InvertZ=0
LimitX=0.30
LimitY=0.20
LimitZ=0.40
LimitZBack=0.10
